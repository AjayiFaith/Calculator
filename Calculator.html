<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="Calculator.css">
</head>
<body>
  <div class="container">
    <input id="display" readonly>
    <div class="buttons">
      <button class="operations" onclick="clearDisplay()">C</button>
      <button onclick="appendToDisplay('7')">7</button>
      <button onclick="appendToDisplay('8')">8</button>
      <button onclick="appendToDisplay('9')">9</button>
      <button class="operations" onclick="appendToDisplay('+')">&plus;</button>
      <button onclick="appendToDisplay('4')">4</button>
      <button onclick="appendToDisplay('5')">5</button>
      <button onclick="appendToDisplay('6')">6</button>
      <button class="operations" onclick="appendToDisplay('*')">&times;</button>
      <button onclick="appendToDisplay('1')">1</button>
      <button onclick="appendToDisplay('2')">2</button>
      <button onclick="appendToDisplay('3')">3</button>
      <button class="operations" onclick="appendToDisplay('/')">/</button>
      <button class="operations" onclick="del('del')">del</button>
      <button onclick="appendToDisplay('00')">00</button>
      <button onclick="appendToDisplay('0')">0</button>
      <button class="operations" onclick="appendToDisplay('-')">&minus;</button>
      <button class="operations" onclick="calculate()">&equals;</button>
      <button onclick="appendToDisplay('.')">.</button>
      <button onclick="appendToDisplay('')"></button>

    </div>
  </div>
  <script src="Calculator.js"></script>
</body>
</html>
